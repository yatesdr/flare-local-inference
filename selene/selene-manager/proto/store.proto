// Persisted namespace descriptors.
syntax = "proto3";
package selene.store;

message RankPlanes { repeated uint64 plane_bytes = 1; uint64 row_bytes = 2; }
message Descriptor {
  bytes identity = 1; bytes fingerprint = 2; uint64 page_tokens = 3;
  repeated RankPlanes ranks = 4; uint64 page_record_bytes = 5;
  uint64 row_record_bytes = 6; string tenant = 7;
}
